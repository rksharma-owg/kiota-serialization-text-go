name: Contribution preflight
on:
  workflow_dispatch:
    inputs:
      patch_sha:
        required: true
        type: string
      baseline_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, patch]
    env:
      TESTED_SHA: ${{ matrix.revision == 'patch' && inputs.patch_sha || inputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '^1.24'
      - run: go version
      - run: go install
      - run: go build
      - run: go test ./... -count=1 -json > result.out
      - run: go vet ./...
      - run: go test -coverprofile cover.out -coverpkg=./... ./...
      - run: test -z "$(gofmt -l text_serialization_writer.go text_serialization_writer_test.go)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-${{ matrix.revision }}
          path: |
            result.out
            cover.out
          if-no-files-found: error
  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, patch]
    env:
      TESTED_SHA: ${{ matrix.revision == 'patch' && inputs.patch_sha || inputs.baseline_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TESTED_SHA }}
          persist-credentials: false
      - name: Verify source revision
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '^1.24'
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: go
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.zst
      - uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          upload: false
          output: sarif-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-${{ matrix.revision }}
          path: sarif-results/*.sarif
          if-no-files-found: error
